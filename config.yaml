user:
  name: Алексей
  aliases: [Лёша, Лёха, Лёшенька, Зайка, Солнце]
  timezone: "УТОЧНИТЬ"          # ← нужен город
  address_as: "Лёша"

persona:
  name: Киви
  wake_names: [киви]            # меняется на ходу
  style: тёплая подруга, на «ты», лёгкий юмор, коротко
  proactive: true
  speak_over_media: true
  duck_music_to: 0.2

audio:
  hostapi: "Windows WASAPI"
  input_device_name: "Микрофон (fifine SC3)"
  input_fallback_name: "Микрофон (fifine SC3)"
  input_gain: 1.0               # входной гейн: 1.0 = без усиления, 4.0 = x4
  output_device_name: "Наушники (2- Temple Pro Purple)"
  capture_samplerate: 48000
  target_samplerate: 16000
  playback_samplerate: 48000
  resampler: soxr
  channels: 1
  block_ms: 32
  aec: false
  vad_end_silence_ms: 400
  barge_in_ms: 250
  pre_roll_ms: 300
  mute_hotkey: "Ctrl+Alt+M"
  push_to_talk: "Ctrl+Space"

stt:
  primary: local                # faster-whisper на CUDA (при недоступности — CPU)
  fallback: polza               # при исключении локального движка — облако
  model: large-v3-turbo
  compute_type: int8_float16
  language: ru
  beam_size: 1

memory:
  enabled: true
  vault_path: "memory"
  kinds: [profile, schedule, tasks, topics, people]
  reflect_every_turns: 20
  reflect_on_idle_min: 10
  reflect_check_s: 60
  reflect_min_interval_s: 300
  retrieve_k: 4
  embed_model: "baai/bge-m3"

speaker:
  enabled: true
  gate: tools_only              # чужие болтать могут
  threshold: 0.65

brain:
  orchestrator: "deepseek/deepseek-v4.1-flash-1017"
  opencode_workdir: "data/opencode_jobs"   # папка задач CLI: подпапка <uuid8> на запрос
  tiers:
    cheap: "deepseek/deepseek-v4.1-flash-1017"
    coder: "google/gemini-4-hydrogen"
    vision: "openai/gpt-6.1-terra"
    strong: "anthropic/claude-sonnet-5.5"
  local: {model: qwen3-14b-instruct-q4_k_m, ctx: 8192, gpu_layers: all}
  routing:
    chat: cheap
    intent: cheap
    memory: cheap
    code: opencode_cli
    vision: vision
  escalation:
    max_attempts_cheap: 3
    then: coder
    max_attempts_coder: 2
    then_next: strong           # в задании оба перехода назывались "then"; в YAML это дубль ключа
  budget:
    monthly_rub: 3000
    warn_at: 0.8
    timezone: "Asia/Novosibirsk"
  prices:                       # руб за 1000 токенов, если в ответе нет usage.cost_rub
    default: {in: 0.0, out: 0.0}
  language_switch: voice_command

planner:
  strategy: llm_with_fallback    # llm_with_fallback | llm_only | fuzzy_only
  catalog_max_tokens: 600        # бюджет каталога умений в промпте планировщика
  fallback_on_parse_error: true  # битый JSON/чужое имя скилла -> старый difflib

gap_closer:
  min_frequency: 3          # пытаться закрыть пробел после 3 запросов
  reactivate_threshold: 0.7 # difflib-порог похожести имени/триггеров
  compose_enabled: true     # разрешать LLM-композицию из умений
  ask_enabled: true         # разрешать уточняющие вопросы пользователю

search:
  enabled: true
  max_results: 3
  timeout_s: 15
  fact_keywords: ["кто", "что", "когда", "где", "сколько", "почему",
                  "как", "выиграл", "произошло", "стоит", "находится"]

api:
  host: "127.0.0.1"        # строго loopback
  port: 8765
  ask_timeout_s: 60
  confirm_timeout_s: 120

conversation:
  enabled: true
  silence_s: 8              # окно = тишина пользователя после её ответа
  end_phrases: ["конец диалога", "заверши диалог", "отбой"]
  greeting_phrases: ["привет", "здравствуй", "хай", "приветик", "добрый день",
                     "добрый вечер"]

budget:
  brain_monthly_rub: 3000
  voice_monthly_rub: 800
  on_exceed: fallback_local_and_warn

tts:
  primary: polza_gemini
  model: "google/gemini-3.8-flash-tts"
  voice: "Leda"
  streaming: true
  base64_response: true
  audio_format: mp3

lipsync:
  mode: phoneme
  method: forced_alignment
  viseme_map: {a: aa, i: ih, u: ou, e: ee, o: oh}
  crossfade_ms: 70

avatar:
  model: "ВЫБРАТЬ_VRM"
  framing: full_body
  monitor: 1
  always_on_top: true
  click_through: true
  hide_in_games: true

safety:
  confirm: [delete, overwrite_outside_workspace, terminal_outside_workspace,
            install, send_email, purchase, password]
  confirm_mode: voice_yes_and_screen_card
  mass_delete_threshold: 5      # >5 файлов — только клик, не голос
  sandbox: D:\Kivi\workspace
  trash_only: true
  git_checkpoint: true

skills:
  dir: "skills"
  installed_dir: "skills/installed"
  auto_disable_after_fails: 3
  call_timeout_s: 30
  browser: {engine: chrome_extension, actions: read_and_act}
  vision: {mode: on_demand}
  music: {provider: yandex_desktop, control: smtc, search: unofficial_api}
  telegram: {remote_commands: true, armed: false, whitelist: [ТВОЙ_USER_ID]}
  home: {adapters: [tuya, yandex], ha: later}
  rag: {scan: inventory_first, graph: true, graph_model: local, ocr: lazy}