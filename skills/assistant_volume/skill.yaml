name: assistant_volume
version: "1.0.0"
description: "Своя громкость Киви. args: {level: 0..1} (или проценты) либо {factor: float} (0.5 = тише вдвое)"
category: system
triggers:
  - тише
  - громче
  - убавь громкость
  - прибавь громкость
  - уменьши громкость
  - сделай тише
  - сделай громче
  - громкость
intents:
  - изменить громкость ассистента
  - сделать голос тише
  - сделать голос громче
requires:
  python: ">=3.12"
  binaries: []
  env: []
  hardware: []
permissions:
  network: []
  filesystem: []
  tools: [self_volume]
  risk: safe
entry: "handler.py:handle"
enabled: true
source:
  kind: builtin
  repo: ""
  commit: ""
