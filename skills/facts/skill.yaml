name: facts
version: "1.1.0"
description: "Курс валют, курс крипты и погода из открытых API без ключей"
category: data
triggers:
  - курс доллара
  - курс евро
  - курс биткоина
  - сколько стоит доллар
  - сколько стоит биткоин
  - погода
  - температура
  - погода в городе
  - температура на улице
intents:
  - узнать курс валюты
  - узнать курс криптовалюты
  - узнать погоду
  - узнать температуру
requires:
  python: ">=3.12"
  binaries: []
  env: []
  hardware: []
permissions:
  network:
    - open.er-api.com
    - api.coingecko.com
    - api.open-meteo.com
    - geocoding-api.open-meteo.com
  filesystem: []
  tools: [http_get]
  risk: safe
entry: "handler.py:handle"
enabled: true
source:
  kind: builtin
  repo: ""
  commit: ""
